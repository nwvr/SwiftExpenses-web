issuer: 'From: United Airlines Receipts@united.com'
fields:
  amount:
    regex: (\d{1,3}(?:[.,]\d{3})*[.,]\d{2})
    type: float
  currency:
    regex: USD
    type: string
  invoice_number:
    regex: '[A-Z0-9-]{6,}'
    type: string
    required: false
keywords:
- RECEIPT
- PAYMENT
- 'From: United Airlines Receipts@united.com'
